name: Android build

on:
  push:
    branches: [main, "setup/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Add Android microphone permissions
        run: node scripts/ensure-android-permissions.mjs

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release Android App Bundle (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tersim-pistir-android-${{ github.run_number }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
